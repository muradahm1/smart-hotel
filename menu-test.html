<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Test | RAMZ</title>
    <link rel="stylesheet" href="src/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .menu-loading {
            text-align: center;
            padding: 50px;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #c9b48c;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .empty-state {
            text-align: center;
            padding: 50px;
            grid-column: 1 / -1;
        }
        .empty-state i {
            font-size: 3rem;
            color: #c9b48c;
            margin-bottom: 20px;
        }
        .notification-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #4caf50;
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>RAMZ</h2>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="menu-test.html" class="nav-link active">Menu</a>
            </div>
            <div class="nav-cart">
                <a href="#" class="cart-btn">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero hero-small" style="background: linear-gradient(135deg, rgba(26, 26, 26, 0.8), rgba(201, 180, 140, 0.3)); padding: 60px 0;">
        <div class="hero-content">
            <h1 class="hero-title">Our Menu</h1>
            <p class="hero-subtitle">Delicious dishes crafted with care</p>
        </div>
    </section>

    <!-- Menu Section -->
    <section class="menu-section" style="padding: 50px 0;">
        <div class="container">
            <div class="menu-header">
                <h2 class="section-title">Browse Our Menu</h2>
            </div>

            <!-- Category Filters -->
            <div class="category-filters" style="margin: 30px 0; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
                <button class="filter-btn active" data-category="all" style="padding: 10px 20px; border: 2px solid #c9b48c; background: #c9b48c; color: white; border-radius: 5px; cursor: pointer;">
                    All Items
                </button>
                <button class="filter-btn" data-category="appetizers" style="padding: 10px 20px; border: 2px solid #c9b48c; background: transparent; color: #c9b48c; border-radius: 5px; cursor: pointer;">
                    Appetizers
                </button>
                <button class="filter-btn" data-category="mains" style="padding: 10px 20px; border: 2px solid #c9b48c; background: transparent; color: #c9b48c; border-radius: 5px; cursor: pointer;">
                    Mains
                </button>
                <button class="filter-btn" data-category="desserts" style="padding: 10px 20px; border: 2px solid #c9b48c; background: transparent; color: #c9b48c; border-radius: 5px; cursor: pointer;">
                    Desserts
                </button>
                <button class="filter-btn" data-category="drinks" style="padding: 10px 20px; border: 2px solid #c9b48c; background: transparent; color: #c9b48c; border-radius: 5px; cursor: pointer;">
                    Drinks
                </button>
            </div>

            <!-- Menu Grid -->
            <div class="menu-grid" id="menuGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; margin-top: 30px;">
                <!-- Menu items will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        console.log('Initializing menu test page...');
        
        // Supabase configuration
        const SUPABASE_URL = 'https://ozhvejzazlvsxojeoxcj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96aHZlanphemx2c3hvamVveGNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMzOTkzOTEsImV4cCI6MjA3ODk3NTM5MX0.fXoNjZGYK40OFuEZKGUeNFGVjCJPU9T2acKLhcC8CEg';
        
        let supabaseClient = null;
        let menuItems = [];
        let filteredItems = [];

        // Initialize Supabase
        function initSupabase() {
            if (typeof window.supabase !== 'undefined') {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log('✅ Supabase initialized');
                return true;
            }
            return false;
        }

        // Wait for Supabase library to load
        let checkInterval = setInterval(() => {
            if (initSupabase()) {
                clearInterval(checkInterval);
                loadMenu();
            }
        }, 100);

        // Load menu items
        async function loadMenu() {
            const menuGrid = document.getElementById('menuGrid');
            menuGrid.innerHTML = '<div class="menu-loading"><div class="loading-spinner"></div><p>Loading menu...</p></div>';

            try {
                const { data, error } = await supabaseClient
                    .from('menu_items')
                    .select('*')
                    .eq('is_available', true)
                    .order('category');

                if (error) throw error;

                console.log('✅ Loaded', data.length, 'menu items');
                menuItems = data || [];
                filteredItems = [...menuItems];
                renderMenu();
            } catch (error) {
                console.error('❌ Error loading menu:', error);
                menuGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Unable to load menu</h3>
                        <p>${error.message}</p>
                        <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #c9b48c; color: white; border: none; border-radius: 5px; cursor: pointer;">Retry</button>
                    </div>
                `;
            }
        }

        // Render menu items
        function renderMenu() {
            const menuGrid = document.getElementById('menuGrid');
            menuGrid.innerHTML = '';

            if (filteredItems.length === 0) {
                menuGrid.innerHTML = '<div class="empty-state"><i class="fas fa-utensils"></i><h3>No items found</h3></div>';
                return;
            }

            filteredItems.forEach(item => {
                const menuItem = document.createElement('div');
                menuItem.style.cssText = 'border: 1px solid #ddd; border-radius: 10px; overflow: hidden; background: white;';
                
                menuItem.innerHTML = `
                    <div style="height: 200px; background: #f5f5f5; display: flex; align-items: center; justify-content: center;">
                        ${item.image_url ? 
                            `<img src="${item.image_url}" alt="${item.name}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none'">` :
                            `<i class="fas fa-utensils" style="font-size: 3rem; color: #c9b48c;"></i>`
                        }
                    </div>
                    <div style="padding: 20px;">
                        <div style="color: #c9b48c; font-size: 0.9rem; margin-bottom: 10px;">${item.category}</div>
                        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px;">
                            <h3 style="margin: 0; font-size: 1.2rem;">${item.name}</h3>
                            <span style="color: #c9b48c; font-weight: bold; font-size: 1.1rem;">$${item.price.toFixed(2)}</span>
                        </div>
                        <p style="color: #666; font-size: 0.9rem; margin-bottom: 15px;">${item.description}</p>
                        <button onclick="addToCart('${item.id}')" style="width: 100%; padding: 12px; background: #c9b48c; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem;">
                            <i class="fas fa-plus"></i> Add to Order
                        </button>
                    </div>
                `;
                
                menuGrid.appendChild(menuItem);
            });
        }

        // Filter functionality
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.style.background = 'transparent';
                    b.style.color = '#c9b48c';
                });
                this.style.background = '#c9b48c';
                this.style.color = 'white';

                const category = this.dataset.category;
                if (category === 'all') {
                    filteredItems = [...menuItems];
                } else {
                    filteredItems = menuItems.filter(item => item.category === category);
                }
                renderMenu();
            });
        });

        // Cart functionality
        function addToCart(itemId) {
            const item = menuItems.find(i => i.id === itemId);
            if (!item) return;

            const cart = JSON.parse(localStorage.getItem('restaurant_cart') || '[]');
            const existing = cart.find(c => c.id === itemId);

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...item, quantity: 1 });
            }

            localStorage.setItem('restaurant_cart', JSON.stringify(cart));
            updateCartCount();
            showNotification(`Added ${item.name} to cart!`);
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('restaurant_cart') || '[]');
            const total = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.querySelector('.cart-count').textContent = total;
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification-toast';
            notification.innerHTML = `<i class="fas fa-check-circle"></i><p>${message}</p>`;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        // Initialize cart count
        updateCartCount();
    </script>
</body>
</html>
