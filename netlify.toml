[build]
  publish = "."

# Redirect rules for SPA routing
[[redirects]]
  from = "/menu"
  to = "/src/pages/menu.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/src/pages/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/order"
  to = "/src/pages/order.html"
  status = 200
  force = true

[[redirects]]
  from = "/hostess"
  to = "/src/pages/hostess.html"
  status = 200
  force = true

[[redirects]]
  from = "/reviews"
  to = "/src/pages/reviews.html"
  status = 200
  force = true

[[redirects]]
  from = "/chef"
  to = "/src/pages/chef.html"
  status = 200
  force = true

[[redirects]]
  from = "/login"
  to = "/src/pages/login.html"
  status = 200
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"