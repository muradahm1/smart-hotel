<!DOCTYPE html>
<html>
<head>
    <title>PWA Icon Generator</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        canvas { border: 1px solid #ddd; margin: 20px 0; }
        button { background: #c9b48c; color: white; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #b39a6d; }
        .preview { display: flex; gap: 20px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>RAMZ Cashier PWA Icons</h1>
        <p>Click the buttons below to generate and download PWA icons</p>
        
        <div class="preview">
            <div>
                <h3>192x192</h3>
                <canvas id="icon192" width="192" height="192"></canvas>
                <button onclick="downloadIcon('icon192', 'icon-192.png')">Download 192x192</button>
            </div>
            <div>
                <h3>512x512</h3>
                <canvas id="icon512" width="512" height="512"></canvas>
                <button onclick="downloadIcon('icon512', 'icon-512.png')">Download 512x512</button>
            </div>
        </div>
    </div>

    <script>
        function drawIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#c9b48c';
            ctx.fillRect(0, 0, size, size);
            
            // Border
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = size * 0.02;
            ctx.strokeRect(size * 0.05, size * 0.05, size * 0.9, size * 0.9);
            
            // Text
            ctx.fillStyle = '#1a1a1a';
            ctx.font = `bold ${size * 0.25}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('RAMZ', size / 2, size * 0.4);
            
            ctx.font = `${size * 0.12}px Arial`;
            ctx.fillText('CASHIER', size / 2, size * 0.65);
            
            // Icon symbol (cash register)
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = size * 0.015;
            ctx.strokeRect(size * 0.35, size * 0.75, size * 0.3, size * 0.15);
            ctx.fillRect(size * 0.45, size * 0.78, size * 0.1, size * 0.05);
        }
        
        function downloadIcon(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // Draw icons on load
        drawIcon('icon192', 192);
        drawIcon('icon512', 512);
    </script>
</body>
</html>
