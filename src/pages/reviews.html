<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews | RAMZ</title>
    <link rel="stylesheet" href="/src/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>ramz</h2>
            </div>
            <div class="nav-menu">
                <a href="/" class="nav-link" data-translate="nav_home">Home</a>
                <a href="/menu" class="nav-link" data-translate="nav_menu">Menu</a>
                <a href="/reviews" class="nav-link active" data-translate="nav_reviews">Reviews</a>
            </div>
            <div class="nav-language">
                <select onchange="setStoredLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="am">አማርኛ</option>
                    <option value="om">Oromoo</option>
                </select>
            </div>
            <div class="nav-cart">
                <a href="/order" class="cart-btn">
                    <span>🛒</span>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Reviews Section -->
    <section class="reviews-section">
        <div class="container">
            <div class="reviews-header">
                <h2 class="section-title" data-translate="reviews_title">Customer Reviews</h2>
                <button class="btn btn-primary" id="writeReviewBtn" data-translate="reviews_write_button">Write a Review</button>
            </div>

            <!-- Review Form -->
            <div class="review-form-container" id="reviewFormContainer" style="display: none;">
                <form id="reviewForm">
                    <h3 data-translate="reviews_form_title">Share Your Experience</h3>
                    <div class="form-group">
                        <label for="customerName" data-translate="reviews_form_name_label">Your Name</label>
                        <input type="text" id="customerName" required>
                    </div>
                    <div class="form-group">
                        <label for="rating" data-translate="reviews_form_rating_label">Rating</label>
                        <div class="star-rating" id="starRating">
                            <span class="star" data-rating="1">⭐</span>
                            <span class="star" data-rating="2">⭐</span>
                            <span class="star" data-rating="3">⭐</span>
                            <span class="star" data-rating="4">⭐</span>
                            <span class="star" data-rating="5">⭐</span>
                        </div>
                        <input type="hidden" id="ratingValue" required>
                    </div>
                    <div class="form-group">
                        <label for="comment" data-translate="reviews_form_comment_label">Your Review</label>
                        <textarea id="comment" rows="4" data-translate-placeholder="reviews_form_comment_placeholder" placeholder="Tell us about your experience..."></textarea>
                    </div>
                    <div class="form-buttons">
                        <button type="submit" class="btn btn-primary" data-translate="reviews_form_submit_button">Submit Review</button>
                        <button type="button" class="btn btn-secondary" id="cancelReview" data-translate="reviews_form_cancel_button">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Reviews Grid -->
            <div class="reviews-grid" id="reviewsGrid">
                <div class="empty-state">Loading reviews...</div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/src/assets/js/config-public.js"></script>
    <script src="/src/assets/js/supabase.js"></script>
    <script src="/src/assets/js/translation.js"></script>
    <script src="/src/assets/js/reviews.js"></script>
</body>
</html>
