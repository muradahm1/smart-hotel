<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Menu | RAMZ</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <h1 id="loadingTitle" data-translate="table_loading_assigning">Assigning you to your location...</h1>
            <p id="loadingText" data-translate="table_loading_preparing">Please wait while we prepare your menu...</p>
            <div class="loading-progress">
                <div class="progress-bar"></div>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>RAMZ</h2>
                <p id="navLocation" style="font-size: 0.8em; margin: 0;" data-translate="room_nav_location">Loading...</p>
            </div>
            <div class="nav-menu">
                <a href="../../index.html" class="nav-link" data-translate="nav_home">Home</a>
                <a href="reviews.html" class="nav-link" data-translate="nav_reviews">Reviews</a>
            </div>
            <div class="nav-cart">
                <a href="#" class="cart-btn" onclick="goToCart()" data-translate="nav_order">
                    <span>🛒</span>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Menu Section -->
    <section class="menu-section">
        <div class="container">
            <div class="menu-header">
                <h2 class="section-title" data-translate="menu_section_title">Our Menu</h2>
                <p id="menuLocation" data-translate="room_menu_location">Loading location...</p>
            </div>

            <!-- Category Filters -->
            <div class="category-filters">
                <button class="filter-btn active" data-category="all">All Items</button>
                <button class="filter-btn" data-category="starters">Starters & Appetizers</button>
                <button class="filter-btn" data-category="international">International Cuisine</button>
                <button class="filter-btn" data-category="traditional">Traditional Specialties</button>
                <button class="filter-btn" data-category="fasting">Fasting & Healthy Options</button>
                <button class="filter-btn" data-category="desserts">Desserts & Sweets</button>
                <button class="filter-btn" data-category="beverages">Beverages & Drinks</button>
            </div>

            <!-- Menu Grid -->
            <div class="menu-grid" id="menuGrid">
                <div class="empty-state">Loading menu...</div>
            </div>
        </div>
    </section>

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="../assets/js/config-public.js"></script>
    <script defer src="../assets/js/supabase.js"></script>
    <script defer src="../assets/js/translation.js"></script>
    <script defer src="../assets/js/menu.js"></script>
    
    <style>
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .loading-content {
            text-align: center;
            color: #ffffff;
            max-width: 400px;
            padding: 2rem;
        }
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #333;
            border-top: 4px solid #c9b48c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-progress {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 2rem;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #c9b48c, #d4c299);
            border-radius: 2px;
            animation: progress 3s ease-in-out forwards;
        }
        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        #loadingTitle {
            color: #c9b48c;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        #loadingText {
            color: #ccc;
            margin-bottom: 0;
        }
    </style>
    
    <script>
        function goToCart() {
            // Get current page directory
            const currentPath = window.location.pathname;
            const currentDir = currentPath.substring(0, currentPath.lastIndexOf('/'));
            
            // Navigate to order.html in same directory
            if (window.location.protocol === 'file:') {
                // For file:// protocol
                const newPath = currentPath.replace('table.html', 'order.html');
                window.location.href = newPath;
            } else {
                // For http/https protocol
                window.location.href = './order.html';
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            // Get table/room info from URL
            const urlParams = new URLSearchParams(window.location.search);
            const tableNumber = urlParams.get('table') || urlParams.get('t');
            const roomNumber = urlParams.get('room') || urlParams.get('r');
            const floor = urlParams.get('floor') || urlParams.get('f') || '1';
            
            let locationInfo;
            if (roomNumber) {
                locationInfo = {
                    type: 'room',
                    number: roomNumber,
                    floor: floor,
                    location: `Floor ${floor}, Room ${roomNumber}`
                };
                document.getElementById('loadingTitle').textContent = `Welcome to Room ${roomNumber}`;
                document.getElementById('loadingText').textContent = `Preparing your room service menu...`;
            } else if (tableNumber) {
                locationInfo = {
                    type: 'table',
                    number: tableNumber,
                    floor: floor,
                    location: `Floor ${floor}, Table ${tableNumber}`
                };
                document.getElementById('loadingTitle').textContent = `Welcome to Table ${tableNumber}`;
                document.getElementById('loadingText').textContent = `Preparing your dining menu...`;
            }
            
            // Always hide loading screen after 2 seconds
            setTimeout(() => {
                document.getElementById('loadingScreen').style.display = 'none';
                
                if (locationInfo) {
                    localStorage.setItem('currentLocation', JSON.stringify(locationInfo));
                    localStorage.setItem('ramzFromQR', 'true');
                    localStorage.setItem('ramzTableId', locationInfo.number);
                    
                    document.getElementById('navLocation').textContent = locationInfo.location;
                    document.getElementById('menuLocation').textContent = `You are at ${locationInfo.location}. Browse our menu and place your order!`;
                } else {
                    document.getElementById('navLocation').textContent = 'Welcome';
                    document.getElementById('menuLocation').textContent = 'Browse our menu and place your order!';
                }
            }, 2000);
        });
    </script>
</body>
</html>
