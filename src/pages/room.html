<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Service | RAMZ</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <h1 id="loadingTitle">Welcome to Room Service</h1>
            <p id="loadingText">Preparing your room service menu...</p>
            <div class="loading-progress">
                <div class="progress-bar"></div>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>RAMZ</h2>
                <p id="navLocation" style="font-size: 0.8em; margin: 0;">Loading...</p>
            </div>
            <div class="nav-menu">
                <a href="../../index.html" class="nav-link">Home</a>
                <a href="reviews.html" class="nav-link">Reviews</a>
            </div>

            <div class="nav-cart">
                <a href="order.html" class="cart-btn">
                    <span>🛒</span>
                    <span class="cart-count">0</span>
                </a>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Menu Section -->
    <section class="menu-section">
        <div class="container">
            <div class="menu-header">
                <h2 class="section-title">Room Service Menu</h2>
                <p id="menuLocation">Loading location...</p>
            </div>

            <!-- Category Filters -->
            <div class="category-filters">
                <button class="filter-btn active" data-category="all">All Items</button>
                <button class="filter-btn" data-category="starters">Starters & Appetizers</button>
                <button class="filter-btn" data-category="international">International Cuisine</button>
                <button class="filter-btn" data-category="traditional">Traditional Specialties</button>
                <button class="filter-btn" data-category="fasting">Fasting & Healthy Options</button>
                <button class="filter-btn" data-category="desserts">Desserts & Sweets</button>
                <button class="filter-btn" data-category="beverages">Beverages & Drinks</button>
            </div>
            
            <!-- Menu Grid -->
            <div class="menu-grid" id="menuGrid">
                <div class="empty-state">Loading menu...</div>
            </div>
        </div>
    </section>

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="../assets/js/config-public.js"></script>
    <script defer src="../assets/js/supabase.js"></script>
    <script defer src="../assets/js/translation.js"></script>
    <script defer src="../assets/js/room.js"></script>
    <script defer src="../assets/js/menu.js"></script>
    
    <style>
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .loading-content {
            text-align: center;
            color: #ffffff;
            max-width: 400px;
            padding: 2rem;
        }
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #333;
            border-top: 4px solid #c9b48c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-progress {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 2rem;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #c9b48c, #d4c299);
            border-radius: 2px;
            animation: progress 0.5s ease-in-out forwards;
        }
        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        #loadingTitle {
            color: #c9b48c;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        #loadingText {
            color: #ccc;
            margin-bottom: 0;
        }
    </style>
</body>
</html>
