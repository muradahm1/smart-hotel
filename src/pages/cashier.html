<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cashier | RAMZ</title>
        <link rel="icon" href="/favicon.ico" type="image/x-icon">
        <link rel="manifest" href="/cashier-manifest.json">
        <meta name="theme-color" content="#c9b48c">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <link rel="stylesheet" href="/src/assets/css/style.css" />
        <link rel="stylesheet" href="/src/assets/css/cashier.css" />
    </head>
    <body>
        <!-- Quick Search -->
        <div class="quick-search">
            <input type="text" id="orderSearch" placeholder="Search Order ID or Table..." autofocus>
            <button id="searchBtn" class="btn btn-primary">Search</button>
            <button id="refreshOrders" class="btn btn-secondary">
                <i class="fas fa-sync"></i> Refresh
            </button>
            <button id="printLastBtn" class="btn btn-secondary">
                <i class="fas fa-print"></i> Print Last
            </button>
            <button id="manualPrintBtn" class="btn btn-secondary">
                <i class="fas fa-receipt"></i> Manual Print
            </button>
            <button id="installBtn" class="btn btn-primary" style="display: none;">
                <i class="fas fa-download"></i> Install App
            </button>
        </div>

        <!-- Daily Sales Summary -->
        <div class="sales-summary">
            <div class="sales-item">
                <span class="sales-label">Today's Sales:</span>
                <span id="todaySales" class="sales-value">0.00</span>
            </div>
            <div class="sales-item">
                <span class="sales-label">Orders:</span>
                <span id="orderCount" class="sales-value">0</span>
            </div>
            <div class="sales-item">
                <span class="sales-label">Ready:</span>
                <span id="readyCount" class="sales-value">0</span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="cashier-layout">
            <!-- Left Side - Orders List -->
            <div class="orders-panel">
                <div class="orders-header">
                    <h2>Ready Orders</h2>
                    <div class="order-status-indicators">
                        <div class="status-indicator new">New</div>
                        <div class="status-indicator waiting">Waiting</div>
                        <div class="status-indicator urgent">Urgent</div>
                    </div>
                </div>
                <div class="orders-list" id="ordersList">
                    <!-- Orders will load here -->
                </div>
            </div>
            
            <!-- Middle - Selected Order Details -->
            <div class="order-details-panel" id="orderDetailsPanel">
                <div class="no-selection">
                    <i class="fas fa-hand-pointer"></i>
                    <h3>Select an Order</h3>
                    <p>Click on an order from the left to view details and process payment</p>
                </div>
            </div>
            
            <!-- Right Side - Payment Panel -->
            <div class="payment-panel" id="paymentPanel" style="display: none;">
                <h3>Process Payment</h3>
                <div id="orderInfo"></div>
                
                <div class="payment-methods-simple">
                    <button class="payment-btn-simple active" data-method="cash">Cash</button>
                    <button class="payment-btn-simple" data-method="card">Card</button>
                    <button class="payment-btn-simple" data-method="mobile">Mobile</button>
                </div>
                
                <div class="amount-input">
                    <label>Total: <span id="totalAmount">0.00</span></label>
                    <div class="quick-amounts">
                        <button class="quick-amount-btn" onclick="simpleCashier.setAmount(20)">20</button>
                        <button class="quick-amount-btn" onclick="simpleCashier.setAmount(50)">50</button>
                        <button class="quick-amount-btn" onclick="simpleCashier.setAmount(100)">100</button>
                        <button class="quick-amount-btn" onclick="simpleCashier.setExactAmount()">Exact</button>
                    </div>
                    <input type="number" id="receivedInput" placeholder="Amount received" step="0.01">
                    <div>Change: <span id="changeDisplay">0.00</span></div>
                </div>
                
                <div class="payment-actions-simple">
                    <button id="payBtn" class="btn btn-success btn-large">PAY & PRINT (Enter)</button>
                    <button id="cancelBtn" class="btn btn-secondary">Cancel (Esc)</button>
                </div>
            </div>
        </div>

        <!-- Manual Order Modal -->
        <div id="manualOrderModal" class="modal" style="display: none;">
            <div class="modal-content manual-order">
                <div class="modal-header">
                    <h3>Create Manual Order</h3>
                    <button id="closeManualOrder" class="close-btn">&times;</button>
                </div>
                
                <div class="manual-order-content">
                    <div class="menu-items-panel">
                        <h4>Menu Items</h4>
                        <div class="menu-search">
                            <input type="text" id="menuSearch" placeholder="Search menu items...">
                        </div>
                        <div id="menuItemsList" class="menu-items-list">
                            <!-- Menu items will load here -->
                        </div>
                    </div>
                    
                    <div class="order-builder-panel">
                        <h4>Order Items</h4>
                        <div id="orderItemsList" class="order-items-list">
                            <div class="empty-order">No items added</div>
                        </div>
                        
                        <div class="order-total">
                            <strong>Total: <span id="manualOrderTotal">0.00</span></strong>
                        </div>
                        
                        <div class="manual-order-actions">
                            <button id="printManualOrder" class="btn btn-success">Print Receipt</button>
                            <button id="clearManualOrder" class="btn btn-secondary">Clear All</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="/src/assets/js/config-public.js"></script>
        <script src="/src/assets/js/supabase.js"></script>
        <script src="/src/assets/js/shifts-auth.js"></script>
        <script src="/src/assets/js/offline-cache.js"></script>
        <script src="/src/assets/js/cashier-simple.js"></script>
        <script>
            // PWA Install functionality
            let deferredPrompt;
            const installBtn = document.getElementById('installBtn');
            
            // Check if running in standalone mode (launched as app)
            function isRunningStandalone() {
                return (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone);
            }
            
            // Handle the install prompt
            window.addEventListener('beforeinstallprompt', (e) => {
                console.log('👍 PWA Install Prompt intercepted! App is installable.');
                e.preventDefault();
                deferredPrompt = e;
                
                // If event fires, app is not installed. Clear any stale local storage.
                localStorage.removeItem('pwa-installed');
                
                installBtn.style.display = 'inline-block';
                installBtn.disabled = false;
                installBtn.innerHTML = '<i class="fas fa-download"></i> Install App';
            });
            
            // Handle install button click
            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    }
                    deferredPrompt = null;
                }
            });
            
            // Listen for successful install
            window.addEventListener('appinstalled', () => {
                console.log('PWA was installed');
                localStorage.setItem('pwa-installed', 'true');
                installBtn.style.display = 'none';
            });
            
            // Check on load if already installed
            window.addEventListener('load', () => {
                if (isRunningStandalone()) {
                    installBtn.style.display = 'none';
                } else if (localStorage.getItem('pwa-installed') === 'true') {
                    installBtn.innerHTML = '<i class="fas fa-check-circle"></i> App Installed';
                    installBtn.disabled = true;
                    installBtn.style.display = 'inline-block';
                } else {
                    console.log('PWA not yet installable or already installed. Check console for "beforeinstallprompt".');
                }
            });
            
            // Register Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/cashier-sw.js')
                    .then(registration => {
                        console.log('✅ Service Worker registered:', registration.scope);
                        
                        // Check for updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    if (confirm('New version available! Reload to update?')) {
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                    })
                    .catch(err => console.error('❌ Service Worker failed:', err));
            }
            
            // Online/Offline status
            window.addEventListener('online', () => {
                console.log('📡 Back online');
                if (window.simpleCashier) {
                    window.simpleCashier.showNotification('Back online - syncing data...', 'success');
                    window.simpleCashier.loadOrders();
                }
            });
            
            window.addEventListener('offline', () => {
                console.log('📴 Offline mode');
                if (window.simpleCashier) {
                    window.simpleCashier.showNotification('Offline mode - orders cached locally', 'info');
                }
            });
            
            // Display connection status
            if (!navigator.onLine) {
                setTimeout(() => {
                    if (window.simpleCashier) {
                        window.simpleCashier.showNotification('Working offline', 'info');
                    }
                }, 2000);
            }
        </script>
    </body>
</html>
